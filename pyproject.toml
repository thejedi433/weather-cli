[project]
name = "weather-cli"
version = "0.1.0"
description = "Minimal weather CLI with location memory and daily forecast caching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
weather = "weather_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["weather_cli"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
